---
argument_specs:
  main:
    short_description: Install and configure the web application
    description:
      - Installs nginx and deploys the app.
    author: fixture
    options:
      webapp_port:
        type: int
        default: 8080
        description: Port nginx listens on.
      webapp_server_name:
        type: str
        required: true
        description: Public DNS name.
      webapp_tls_mode:
        type: str
        choices: [off, self_signed, acme]
        default: self_signed
        description: How the certificate is obtained.
      webapp_admin_password:
        type: str
        no_log: true
        description: Initial admin password.
      webapp_upstreams:
        type: list
        elements: dict
        description: Backend servers.
        options:
          host:
            type: str
            required: true
          port:
            type: int
            default: 9000
  configure:
    short_description: Only (re)write configuration files
    options:
      webapp_port:
        type: int
        default: 8080
