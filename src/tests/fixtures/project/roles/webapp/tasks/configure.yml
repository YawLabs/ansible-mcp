---
- name: Write nginx site
  ansible.builtin.template:
    src: site.conf.j2
    dest: /etc/nginx/sites-enabled/app.conf
    mode: "0644"
  notify: Reload nginx

- name: Set admin password
  ansible.builtin.command: /usr/local/bin/app-admin set-password
  args:
    stdin: "{{ webapp_admin_password }}"
  no_log: true
  changed_when: false
